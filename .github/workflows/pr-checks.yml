name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes that need build and test checks
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr-changed-files"
          code=false
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*|.github/CODEOWNERS) ;;
              *) code=true ;;
            esac
          done < "$RUNNER_TEMP/pr-changed-files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Rust for license inventory
        run: rustup toolchain install 1.91.1 --profile minimal && rustup default 1.91.1
      - name: Install dependencies
        run: npm ci
      - name: Check styles
        run: npm run check:styles
      - name: Build frontend and check types
        run: npm run build
      - name: Run unit tests
        run: npm run test:unit
      - name: Check release metadata
        run: npm run check:release
      - name: Check dependency license inventory
        run: npm run check:licenses

  rust:
    name: Rust checks (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
          - platform: macOS
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt
          rustup default 1.91.1
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            tools/verify-updater-manifest/target
          key: pr-cargo-${{ runner.os }}-${{ runner.arch }}-1.91.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            pr-cargo-${{ runner.os }}-${{ runner.arch }}-1.91.1-
      - name: Install frontend dependencies and build assets
        run: npm ci && npm run build
      - name: Check Rust formatting
        run: |
          cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
          cargo fmt --check --manifest-path tools/verify-updater-manifest/Cargo.toml
      - name: Check Rust compilation
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Run Rust tests
        run: |
          cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path tools/verify-updater-manifest/Cargo.toml

  required:
    name: PR checks passed
    needs: [changes, frontend, rust]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks or a documentation-only change
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE_CHANGED" = false ]; then
            test "$FRONTEND_RESULT" = skipped
            test "$RUST_RESULT" = skipped
          else
            test "$CODE_CHANGED" = true
            test "$FRONTEND_RESULT" = success
            test "$RUST_RESULT" = success
          fi
