name: Build Mac App Store package

on:
  push:
    tags:
      - 'v*'
      - '!v*-rc.*'

permissions:
  contents: read

concurrency:
  group: mac-app-store-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.11.1
  RUST_VERSION: 1.91.1
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  package:
    name: Package Mac App Store edition
    runs-on: macos-14
    timeout-minutes: 120
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set release version from tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported Mac App Store release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo 'Mac App Store release tags must point to a commit on main.' >&2
            exit 1
          fi
          node scripts/set-release-version.mjs "${RELEASE_TAG#v}"
          node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Set up Rust targets
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Import App Store signing materials
        shell: bash
        env:
          APP_STORE_APP_CERTIFICATE_BASE64: ${{ secrets.APP_STORE_APP_CERTIFICATE_BASE64 }}
          APP_STORE_APP_CERTIFICATE_PASSWORD: ${{ secrets.APP_STORE_APP_CERTIFICATE_PASSWORD }}
          APP_STORE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APP_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          APP_STORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
          APP_STORE_PROFILE_BASE64: ${{ secrets.APP_STORE_PROFILE_BASE64 }}
          APP_STORE_TEAM_ID: ${{ vars.APP_STORE_TEAM_ID }}
        run: |
          for name in APP_STORE_APP_CERTIFICATE_BASE64 APP_STORE_APP_CERTIFICATE_PASSWORD APP_STORE_INSTALLER_CERTIFICATE_BASE64 APP_STORE_INSTALLER_CERTIFICATE_PASSWORD APP_STORE_PROFILE_BASE64 APP_STORE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required App Store signing setting $name is not configured." >&2
              exit 1
            fi
          done
          if [[ ! "$APP_STORE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo 'APP_STORE_TEAM_ID must be a ten-character Apple Team ID.' >&2
            exit 1
          fi

          umask 077
          app_certificate="$RUNNER_TEMP/vpaste-app-store-application.p12"
          installer_certificate="$RUNNER_TEMP/vpaste-app-store-installer.p12"
          profile="$RUNNER_TEMP/vpaste-app-store.provisionprofile"
          keychain="$RUNNER_TEMP/vpaste-app-store.keychain-db"
          printf '%s' "$APP_STORE_APP_CERTIFICATE_BASE64" | base64 --decode > "$app_certificate"
          printf '%s' "$APP_STORE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$installer_certificate"
          printf '%s' "$APP_STORE_PROFILE_BASE64" | base64 --decode > "$profile"

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for certificate in "$app_certificate" "$installer_certificate"; do
            if [[ "$certificate" == "$app_certificate" ]]; then
              certificate_password="$APP_STORE_APP_CERTIFICATE_PASSWORD"
            else
              certificate_password="$APP_STORE_INSTALLER_CERTIFICATE_PASSWORD"
            fi
            security import "$certificate" \
              -k "$keychain" \
              -P "$certificate_password" \
              -t cert \
              -f pkcs12 \
              -T /usr/bin/codesign \
              -T "$(xcrun --find productbuild)"
          done
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain"

          app_identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' -v team="($APP_STORE_TEAM_ID)" '$2 ~ /^Apple Distribution:/ && substr($2, length($2) - length(team) + 1) == team { print $2 }')"
          installer_identity="$(security find-identity -v "$keychain" | awk -F '"' -v team="($APP_STORE_TEAM_ID)" '$2 ~ /^Mac Installer Distribution:/ && substr($2, length($2) - length(team) + 1) == team { print $2 }')"
          if [[ -z "$app_identity" || "$app_identity" == *$'\n'* ]]; then
            echo 'Expected exactly one Apple Distribution identity for APP_STORE_TEAM_ID.' >&2
            exit 1
          fi
          if [[ -z "$installer_identity" || "$installer_identity" == *$'\n'* ]]; then
            echo 'Expected exactly one Mac Installer Distribution identity for APP_STORE_TEAM_ID.' >&2
            exit 1
          fi
          echo "APP_STORE_APP_SIGNING_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "APP_STORE_INSTALLER_SIGNING_IDENTITY=$installer_identity" >> "$GITHUB_ENV"

      - name: Build signed App Store package
        shell: bash
        env:
          APP_STORE_TEAM_ID: ${{ vars.APP_STORE_TEAM_ID }}
          APP_STORE_PROFILE: ${{ runner.temp }}/vpaste-app-store.provisionprofile
          APP_STORE_COPYRIGHT: ${{ vars.APP_STORE_COPYRIGHT }}
          APP_STORE_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.APP_STORE_USES_NON_EXEMPT_ENCRYPTION }}
        run: npm run build:macos-app-store

      - name: Upload signed package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-app-store-${{ github.ref_name }}
          path: src-tauri/target/app-store-build/vPaste_*_mac_app_store.pkg
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing materials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/vpaste-app-store.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/vpaste-app-store-application.p12" \
            "$RUNNER_TEMP/vpaste-app-store-installer.p12" \
            "$RUNNER_TEMP/vpaste-app-store.provisionprofile"
