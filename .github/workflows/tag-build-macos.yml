name: Build macOS packages from tag

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-macos-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.11.1
  RUST_VERSION: 1.91.1
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  package:
    name: Package macOS (${{ matrix.arch }})
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            updater-platform: darwin-aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
            updater-platform: darwin-x86_64

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Validate tag and release version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            echo "VPASTE_UPDATE_CHANNEL=rc" >> "$GITHUB_ENV"
          else
            echo "VPASTE_UPDATE_CHANNEL=stable" >> "$GITHUB_ENV"
          fi
          node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust target
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release secret $name is not configured." >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/vpaste-developer-id.p12"
          keychain_path="$RUNNER_TEMP/vpaste-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security default-keychain -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          identity_hashes="$(printf '%s\n' "$identities" | awk '
            length($2) == 40 && $2 ~ /^[[:xdigit:]]+$/ && /"Developer ID Application:/ { print $2 }
          ')"
          identity_count="$(printf '%s\n' "$identity_hashes" | awk 'NF { count++ } END { print count + 0 }')"
          if [[ "$identity_count" -ne 1 ]]; then
            echo "Expected exactly one valid Developer ID Application identity, found $identity_count." >&2
            exit 1
          fi
          identity_hash="$identity_hashes"
          echo "APPLE_SIGNING_IDENTITY=$identity_hash" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ -z "$APPLE_API_PRIVATE_KEY" ]]; then
            echo "Required release secret APPLE_API_PRIVATE_KEY is not configured." >&2
            exit 1
          fi
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build signed and notarized macOS packages
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_API_ISSUER APPLE_API_KEY APPLE_SIGNING_IDENTITY TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release secret $name is not configured." >&2
              exit 1
            fi
          done

          identities="$(security find-identity -v -p codesigning)"
          printf '%s\n' "$identities"
          if ! printf '%s\n' "$identities" | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
            echo "Imported Developer ID identity is not discoverable through the user keychain search list." >&2
            exit 1
          fi

          VERSION="$RELEASE_VERSION" \
          MACOS_BUILD_TARGET="${{ matrix.target }}" \
          OUTPUT_PATH="$RUNNER_TEMP/latest.macos.json" \
          npm run build:macos-release

      - name: Verify and stage macOS packages
        shell: bash
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$(find "$bundle" -type d -path '*/macos/*.app' -print | sort | tail -n 1)"
          dmg="$(find "$bundle" -type f -path '*/dmg/*.dmg' -print | sort | tail -n 1)"
          updater="$(find "$bundle" -type f -name '*.app.tar.gz' -print | sort | tail -n 1)"

          for artifact in "$app" "$dmg" "$updater" "${updater}.sig"; do
            if [[ -z "$artifact" || ! -e "$artifact" ]]; then
              echo "Expected macOS artifact was not found: $artifact" >&2
              exit 1
            fi
          done

          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # Tauri staples the notarized app before placing it in the signed DMG.
          xcrun stapler validate "$app"
          codesign --verify --strict --verbose=2 "$dmg"

          mkdir -p release-assets
          staged_dmg="release-assets/vPaste_${RELEASE_VERSION}_macos_${{ matrix.arch }}.dmg"
          staged_updater="release-assets/vPaste_${RELEASE_VERSION}_macos_${{ matrix.arch }}.app.tar.gz"
          cp "$dmg" "$staged_dmg"
          cp "$updater" "$staged_updater"
          cp "${updater}.sig" "${staged_updater}.sig"
          node scripts/generate-updater-manifest.mjs \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --version "$RELEASE_VERSION" \
            --artifact "$staged_updater" \
            --signature "${staged_updater}.sig" \
            --platforms "${{ matrix.updater-platform }}" \
            --output "release-assets/latest.macos-${{ matrix.arch }}.json"
          (
            cd release-assets
            shasum -a 256 ./* > SHA256SUMS.txt
          )

      - name: Upload macOS packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}-${{ github.ref_name }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/vpaste-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/vpaste-developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
