[package]
name = "vpaste-desktop"
version = "1.6.0"
authors = ["Lox"]
edition = "2021"
rust-version = "1.91.1"
default-run = "vPaste"

[[bin]]
name = "vPaste"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true


[build-dependencies]
tauri-build = { version = "2", features = [] }
resvg = { version = "0.47.0", default-features = false }

[dependencies]
tauri = { version = "=2.11.2", features = ["macos-private-api", "tray-icon", "protocol-asset", "unstable"] }
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-log = "=2.8.0"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-notification = "=2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.0"
minisign-verify = "0.2.5"
semver = "1.0"
chacha20poly1305 = "0.10"
sha2 = "0.10.8"
twox-hash = "2.1"
hex = "0.4"
image = "0.25.0"
rumqttc = "0.24.0"
lazy_static = "1.4.0"
rand = "0.8.5"
strum = "0.26"
strum_macros = "0.26"
chrono = "0.4.31"
log = "0.4"
tokio = { version = "1", features = ["full"] }
regex = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
libsqlite3-sys = { version = "0.28.0", features = ["bundled"] }
tantivy = { version = "0.22.0", default-features = false, features = ["mmap"] }
tempfile = "3.10.1"
zip = "2.2.2"
ctor = "0.2.7"
env_logger = "0.11.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.24.0"
backtrace = "0.3"
rdev = "0.5"
infer = { version = "0.15.0", default-features = false, features = ["std"] }
arboard = "3.6.1"
reqwest = { version = "0.12.24", features = ["blocking", "cookies"] }
scraper = "0.24.0"
tauri-plugin-clipboard-manager = "=2.3.2"
window-vibrancy = "=0.6.0"

[target."cfg(windows)".dependencies]
winreg = "0.55"
clipboard-win = { version = "5.3.0", features = ["monitor"] }
windows = { version = "0.56.0", features = ["Wdk_System_Threading", "Win32_System_Threading", "Win32_System_Kernel", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Ole", "Win32_Globalization"] }

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.25"
objc = "0.2.7"
core-graphics = "0.19.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "=2.3.1"
