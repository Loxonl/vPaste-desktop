name: UI Checks

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "scripts/check-ui-style-architecture.mjs"
      - ".github/workflows/ui-checks.yml"
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check UI architecture
        run: npm run check:styles

      - name: Build frontend
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit
