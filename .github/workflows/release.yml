name: Build draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, without the v prefix
        required: true
        type: string
      source_sha:
        description: Full source commit SHA to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.11.1
  RUST_VERSION: 1.91.1
  RELEASE_VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate inputs, source, and version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA,,}"
          node scripts/check-release-version.mjs "v$RELEASE_VERSION"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install Tauri Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend, Rust, versions, and licenses
        shell: bash
        run: |
          npm run build
          npm run check:release -- "v$RELEASE_VERSION"
          npm run check:licenses
          cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo fmt --manifest-path tools/verify-updater-manifest/Cargo.toml --check
          cargo test --manifest-path tools/verify-updater-manifest/Cargo.toml --locked
      - name: Generate release metadata
        shell: bash
        run: |
          mkdir -p release-metadata
          node scripts/check-third-party-licenses.mjs \
            --output release-metadata/THIRD_PARTY_LICENSES.json \
            --sbom "release-metadata/vPaste_${RELEASE_VERSION}_sbom.cdx.json"
          cp LICENSE docs/open-source/third-party-notices.md release-metadata/
      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata
          path: release-metadata
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Rust and Inno Setup
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          $innoUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $innoInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          Invoke-WebRequest -UseBasicParsing -Uri $innoUrl -OutFile $innoInstaller
          $actualHash = (Get-FileHash -Algorithm SHA256 $innoInstaller).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup hash mismatch. Expected $expectedHash, found $actualHash."
          }
          $install = Start-Process -FilePath $innoInstaller `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup installation exited with code $($install.ExitCode)."
          }
          $compilerCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $compiler = $compilerCandidates |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $compiler) {
            throw 'Inno Setup compiler was not found after installation.'
          }
          $compilerVersion = (Get-Item -LiteralPath $compiler).VersionInfo.ProductVersion
          if ($compilerVersion -eq '0.0.0.0') {
            $uninstaller = Join-Path (Split-Path -Parent $compiler) 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $compilerVersion = (Get-Item -LiteralPath $uninstaller).VersionInfo.ProductVersion.Trim()
            }
          }
          if (-not $compilerVersion.StartsWith('6.7.3', [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected Inno Setup 6.7.3, found $compilerVersion at $compiler."
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: npm ci
      - name: Build Windows assets
        run: npm run build:windows
      - name: Stage Windows assets
        shell: pwsh
        run: |
          $source = 'src-tauri/target/release/bundle/windows'
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "$source/vPaste_$($env:RELEASE_VERSION)_windows_x64_setup.exe" release-assets/
          Copy-Item "$source/vPaste_$($env:RELEASE_VERSION)_windows_x64_portable.zip" release-assets/
      - name: Upload Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-assets
          path: release-assets
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Rust target
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"
      - name: Install dependencies
        run: npm ci
      - name: Build macOS assets
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION" MACOS_BUILD_TARGET='${{ matrix.target }}' UNSIGNED=1 npm run build:macos-release
      - name: Stage macOS assets
        shell: bash
        run: |
          mkdir -p release-assets
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          dmg="$(find "$bundle" -type f -name '*.dmg' | head -n 1)"
          cp "$dmg" "release-assets/vPaste_${RELEASE_VERSION}_macos_${{ matrix.arch }}.dmg"
      - name: Upload macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}-assets
          path: release-assets
          if-no-files-found: error

  draft-release:
    needs: [validate, windows, macos]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and notes
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS.txt
          cd ..
          {
            echo "Source commit: $SOURCE_SHA"
            echo
            echo '> This is an unsigned development release. Windows may show Unknown publisher. Verify SHA256SUMS.txt before installing.'
            echo
            awk -v prefix="## $RELEASE_VERSION " '
              index($0, prefix) == 1 { capture = 1 }
              capture && /^## / && index($0, prefix) != 1 { exit }
              capture { print }
            ' CHANGELOG.md
          } > RELEASE_NOTES.md
      - name: Create or update Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          error_file="$(mktemp)"
          if release_json="$(gh release view "$tag" --json isDraft,isImmutable,targetCommitish 2>"$error_file")"; then
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            is_immutable="$(jq -r '.isImmutable' <<<"$release_json")"
            target_commitish="$(jq -r '.targetCommitish' <<<"$release_json")"
            if [[ "$is_draft" != "true" || "$is_immutable" == "true" ]]; then
              echo "Refusing to modify published or immutable release $tag." >&2
              exit 1
            fi
            if [[ "${target_commitish,,}" != "${SOURCE_SHA,,}" ]]; then
              echo "Draft $tag targets $target_commitish instead of $SOURCE_SHA." >&2
              exit 1
            fi
            gh release edit "$tag" --target "$SOURCE_SHA" --title "vPaste $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
            gh release upload "$tag" release-assets/* --clobber
          else
            if ! grep -qi 'release not found' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            gh release create "$tag" release-assets/* --draft --target "$SOURCE_SHA" --title "vPaste $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
          fi
